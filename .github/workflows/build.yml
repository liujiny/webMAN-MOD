name: build-webman-mod (PSL1GHT)

on:
  workflow_dispatch: {}

# 👇 allow pulling images from ghcr.io
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/actions/jekyll-build-pages:v1.0.13   # PSL1GHT toolchain preinstalled

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure sLaunch cap is 4000
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z | xargs -0 sed -i -E 's/(#\s*define\s+MAX_SLAUNCH_ITEMS\s+)2000/\14000/'

      - name: Prepare Flags and Patch Makefile
        run: |
          set -eux
          cp ./flags/flags_full.h ./flags.h
          sed -i 's/^include.*sdk.makedef.mk/# &/' Makefile
          sed -i 's/^include.*sdk.target.mk/# &/' Makefile
          sed -i '1i PS3DEV := /usr/local/ps3dev\nPSL1GHT := $(PS3DEV)\ninclude $(PSL1GHT)/ppu_rules' Makefile
          sed -i 's/ppu-lv2-gcc/ppu-gcc/g' Makefile
          sed -i 's/ppu-lv2-g++/ppu-g++/g' Makefile
          sed -i 's/ppu-lv2-objcopy/ppu-objcopy/g' Makefile
          sed -i 's/ppu-lv2-ar/ppu-ar/g' Makefile
          sed -i 's/ppu-lv2-prx-strip/ppu-prx-strip/g' Makefile

      - name: Build
        run: make -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p out
          find . -maxdepth 2 -type f -name 'webftp_server*.sprx' -exec cp -v {} out/ \; || true
          ls -l out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webMAN-MOD-sprx
          path: out
          if-no-files-found: error
