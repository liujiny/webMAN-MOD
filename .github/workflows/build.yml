name: build-webman-mod (PSL1GHT)

on:
  workflow_dispatch: {}

# 👇 allow pulling images from ghcr.io
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev:master

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure sLaunch cap is 4000
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z | xargs -0 sed -i -E 's/(#\s*define\s+MAX_SLAUNCH_ITEMS\s+)2000/\14000/'

      - name: Prepare Flags and Patch Makefile
        run: |
          set -eux
          #1. 准备配置头文件
          cp ./flags/flags_full.h ./flags.h

          # 2. 自动识别文件名
          TARGET="makefile"
          if [ -f "Makefile" ]; then TARGET="Makefile"; fi

          # 3. 动态寻找 ppu_rules 的真实路径
          # 这行命令会在 /usr/local/ps3dev 目录下搜索 ppu_rules 并返回第一个匹配结果
          PPU_RULES_PATH=$(find /usr/local/ps3dev -name ppu_rules | head -n 1)
          echo "Detected ppu_rules at: $PPU_RULES_PATH"

          # 4. 如果没找到则报错提醒（防止后面编译报莫名其妙的错）
          if [ -z "$PPU_RULES_PATH" ]; then
            echo "Error: Could not find ppu_rules in /usr/local/ps3dev"
            exit 1
          fi

          # 5. 屏蔽官方 SDK 引用并注入动态路径
          sed -i 's/^include.*sdk.makedef.mk/# &/' "$TARGET"
          sed -i 's/^include.*sdk.target.mk/# &/' "$TARGET"
          sed -i "1i include $PPU_RULES_PATH" "$TARGET"

          # 6. 替换工具链名称（从官方名改为开源名）
          sed -i 's/ppu-lv2-gcc/ppu-gcc/g' "$TARGET"
          sed -i 's/ppu-lv2-g++/ppu-g++/g' "$TARGET"
          sed -i 's/ppu-lv2-objcopy/ppu-objcopy/g' "$TARGET"
          sed -i 's/ppu-lv2-ar/ppu-ar/g' "$TARGET"
          sed -i 's/ppu-lv2-prx-strip/ppu-prx-strip/g' "$TARGET"

      - name: Build
        run: make -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p out
          find . -maxdepth 2 -type f -name 'webftp_server*.sprx' -exec cp -v {} out/ \; || true
          ls -l out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webMAN-MOD-sprx
          path: out
          if-no-files-found: error
