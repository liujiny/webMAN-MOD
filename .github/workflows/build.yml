name: build-webman-mod (PSL1GHT)

on:
  workflow_dispatch: {}

# 👇 allow pulling images from ghcr.io
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/actions/jekyll-build-pages:v1.0.13   # PSL1GHT toolchain preinstalled

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure sLaunch cap is 4000
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z | xargs -0 sed -i -E 's/(#\s*define\s+MAX_SLAUNCH_ITEMS\s+)2000/\14000/'

      - name: Prepare Flags and Patch Makefile
        run: |
          set -eux
          # 1. 准备配置头文件
          cp ./flags/flags_full.h ./flags.h

          # 2. 自动识别文件名
          TARGET="makefile"
          if [ -f "Makefile" ]; then TARGET="Makefile"; fi

          # 3. 彻底屏蔽官方 SDK 的引用
          sed -i 's/^include.*sdk.makedef.mk/# &/' "$TARGET"
          sed -i 's/^include.*sdk.target.mk/# &/' "$TARGET"

          # 4. 注入正确的 PSL1GHT 编译规则路径
          # 注意：在 ps3dev 镜像中，该文件通常位于 /usr/local/ps3dev/ppu/ 目录下
          sed -i '1i include /usr/local/ps3dev/ppu/ppu_rules' "$TARGET"

          # 5. 替换工具链名称（从官方 lv2 名称改为开源名称）
          sed -i 's/ppu-lv2-gcc/ppu-gcc/g' "$TARGET"
          sed -i 's/ppu-lv2-g++/ppu-g++/g' "$TARGET"
          sed -i 's/ppu-lv2-objcopy/ppu-objcopy/g' "$TARGET"
          sed -i 's/ppu-lv2-ar/ppu-ar/g' "$TARGET"
          sed -i 's/ppu-lv2-prx-strip/ppu-prx-strip/g' "$TARGET"

      - name: Build
        run: make -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p out
          find . -maxdepth 2 -type f -name 'webftp_server*.sprx' -exec cp -v {} out/ \; || true
          ls -l out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webMAN-MOD-sprx
          path: out
          if-no-files-found: error
